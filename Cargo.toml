[package]
name = "pno"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A piano score format and CLI for AI agents"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
roxmltree = "0.21"

[dev-dependencies]
roxmltree = "0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
cast_lossless = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
format_push_string = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
stable_sort_primitive = "warn"
unnested_or_patterns = "warn"
