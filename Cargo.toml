[package]
name = "pno"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A piano score format and CLI for AI agents"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
roxmltree = "0.21"

[dev-dependencies]
roxmltree = "0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
